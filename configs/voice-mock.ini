# Contract demonstration only: transcript fixture -> mock reply -> silent WAV.
[runtime]
queue_capacity = 4
task_timeout_ms = 5000
output_root = ../runs

[pipeline]
stages = asr, llm, tts, file_sink

[asr]
backend = mock
delay_ms = 2

[llm]
backend = mock
token_delay_ms = 2

[tts]
backend = mock
sample_rate = 16000
chunk_delay_ms = 1

[file_sink]
backend = wav

