# Extension template, not a runnable real-model profile yet.
# Selecting an unimplemented backend returns unsupported; no mock fallback.
[runtime]
queue_capacity = 4
task_timeout_ms = 30000
output_root = ../runs

[pipeline]
stages = asr, llm, tts, file_sink

[asr]
backend = sherpa_onnx
model_manifest = ../assets/manifests/model.example.json

[llm]
backend = llama_cpp
model_manifest = ../assets/manifests/model.example.json

[tts]
backend = sherpa_onnx
model_manifest = ../assets/manifests/model.example.json

[file_sink]
backend = wav
