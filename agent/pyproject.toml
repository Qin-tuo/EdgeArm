[project]
name = "edgearm-agent"
version = "0.2.0"
description = "EdgeArm SO-101 agent based on OpenVoiceStream"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "websockets>=12", "sounddevice>=0.4", "numpy>=1.24,<2", "openai>=1.40",
  "pyyaml>=6.0", "aiohttp>=3.9", "voxedge==0.0.15a1", "onnxruntime==1.22.1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
arm = ["feetech-servo-sdk==1.0.0", "pyserial==3.5"]
kws = ["sherpa-onnx==1.13.6", "sentencepiece==0.2.1", "pypinyin==0.55.0"]
[project.scripts]
edgearm = "ovs_agent.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["ovs_agent"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
