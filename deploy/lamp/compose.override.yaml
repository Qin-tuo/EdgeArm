# Merge with ../docker-compose.conversation-rk3588-rk1828.yml.
# Paths resolve against that first file's directory (deploy/).
services:
  profile-init:
    container_name: lamp-cm3588-profile-init
  speech:
    container_name: lamp-cm3588-speech
  llm:
    container_name: lamp-cm3588-llm
  agent:
    container_name: lamp-cm3588-agent
    volumes:
      - ./lamp/agent-config.yaml:/opt/voice/config/agent-config.yaml:ro
    environment:
      LAMP_AUDIO_INPUT: ${LAMP_AUDIO_INPUT:-auto}
      LAMP_AUDIO_OUTPUT: ${LAMP_AUDIO_OUTPUT:-auto}
volumes:
  resolved-profile:
    name: lamp-cm3588-resolved-profile
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAMP_DATA_ROOT:?Set LAMP_DATA_ROOT}/resolved-profile
  rk-asr-models:
    name: lamp-cm3588-asr-models
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAMP_DATA_ROOT:?Set LAMP_DATA_ROOT}/asr
  rk-tts-models:
    name: lamp-cm3588-tts-models
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAMP_DATA_ROOT:?Set LAMP_DATA_ROOT}/tts
  rk1828-llm-models:
    name: lamp-cm3588-llm-models
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAMP_DATA_ROOT:?Set LAMP_DATA_ROOT}/llm
  voice-data:
    name: lamp-cm3588-voice-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAMP_DATA_ROOT:?Set LAMP_DATA_ROOT}/voice-data
  agent-state:
    name: lamp-cm3588-agent-state
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LAMP_DATA_ROOT:?Set LAMP_DATA_ROOT}/agent-state
